services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    # Schema is now Alembic's job end to end (S2-01) — this runs on every
    # container start (a no-op once already at head) so a genuinely fresh
    # database gets migrated to the latest schema before the API accepts
    # requests, same as an existing one just gets brought up to date.
    command: >
      sh -c "alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    # requirepass sourced from .env's REDIS_PASSWORD (S10-02) — docker-compose
    # substitutes ${REDIS_PASSWORD} from the .env file next to this compose
    # file at container-start time, same as every other ${VAR} in this file;
    # it is never baked into the image or this file itself.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"

  celery_worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    # RETIRED (S7-04): the local HTTPS catcher server that used to run in
    # this container and need port 3001 published (S3-07 Item 2) is gone
    # — Enable Banking's redirect now lands directly on the real production
    # domain's own callback route. See kbc_analyzer/enablebanking.py.
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  db-data:
  frontend-node-modules:
