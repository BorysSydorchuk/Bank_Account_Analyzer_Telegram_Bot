[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kbc-analyzer"
version = "1.0.0"
description = "Personal finance analyzer — KBC Belgium Open Banking + Gemini AI + Telegram"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "python-telegram-bot>=20.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "PyJWT>=2.0.0",
    "cryptography>=41.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "anthropic>=0.40.0",
    "celery[redis]>=5.4.0",
]

[project.scripts]
kbc-bot      = "kbc_analyzer.bot:main"
kbc-analyze  = "kbc_analyzer.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kbc_analyzer*"]
